[project]
name = "valor-cliente"
version = "0.1.0"
description = "Quanto vale um cliente novo nos próximos meses, e quando dá para considerar que ele foi embora? BG/NBD, Gamma-Gamma e Kaplan-Meier contra regras simples"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jinja2>=3.1",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valor_cliente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
